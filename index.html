<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energie Tracker</title>
    <script>
      // Fichier généré introuvable (ancienne page gardée par le navigateur après une mise à jour) : on recharge UNE fois au lieu de rester sur un écran blanc.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT' && /\/assets\//.test(t.src || '')) {
          try { if (sessionStorage.getItem('egrid-stale-reload')) return; sessionStorage.setItem('egrid-stale-reload', '1'); } catch (_) {}
          location.reload();
        }
      }, true);
    </script>
      <!-- Police Inter (identique à la maquette validée du Suivi Carburant) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
