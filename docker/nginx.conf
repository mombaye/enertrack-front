server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Pages HTML : jamais en cache — après un déploiement le navigateur doit relire index.html (sinon il réclame d'anciens fichiers
    # disparus, reçoit la page HTML à la place du JavaScript et affiche un écran blanc).
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /pilotage-app/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fichiers générés (nom avec empreinte) : cache long, mais JAMAIS de repli sur index.html (un fichier absent = 404 franche).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
